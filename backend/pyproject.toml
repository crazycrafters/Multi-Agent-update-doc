[project]
name = "ai-resume-evolution"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
 "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "aiosqlite>=0.20,<1",
 "alembic>=1.14,<2", "openai>=2,<3", "langgraph>=1,<2", "python-multipart>=0.0.20",
 "pypdf>=5,<7", "python-docx>=1.1,<2", "reportlab>=4,<5", "httpx>=0.28,<1"
]
[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.17.3",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
